ekf_filter_node:
  ros__parameters:
    frequency: 20.0
    two_d_mode: true
    publish_tf: true
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    sensor_timeout: 0.5

    # No wheel encoders on this build (L298N is open-loop). Odometry comes
    # from rf2o's lidar-scan-matching, fused with IMU yaw rate / accel.
    odom0: /odom_rf2o_cov
    odom0_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 5

