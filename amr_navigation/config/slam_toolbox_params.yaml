slam_toolbox:
  ros__parameters:
    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS params
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    use_map_saver: true
    mode: mapping   # switch to "localization" to relocalize on a saved map

    # If the map is jittery/slow to update, raise these; if you're missing
    # detail, lower them — the Pi's rf2o odom is coarser than wheel encoders
    # so slam_toolbox leans more heavily on scan matching here.
    resolution: 0.05
    max_laser_range: 8.0
    minimum_time_interval: 0.3
    transform_timeout: 0.3
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # Correlation / matching
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Loop closure
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10

    # Motion thresholds — since odom is lidar-derived, don't wait for large
    # motion before updating or you'll starve the scan matcher
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
